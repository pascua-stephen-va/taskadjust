<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <g transform="translate(2, 6)">
    <!-- Background Rounded Shield / Tile -->
    <rect x="1" y="1" width="42" height="34" rx="8" fill="url(#taGradient)" stroke="#00B2FF" stroke-opacity="0.55" stroke-width="1.5" />

    <!-- Top Track & Node -->
    <line x1="8" y1="12" x2="26" y2="12" stroke="#00B2FF" stroke-width="2.2" stroke-linecap="round" stroke-opacity="0.6" />
    <circle cx="20" cy="12" r="3.2" fill="#00B2FF" />
    <circle cx="20" cy="12" r="1.4" fill="#FFFFFF" />

    <!-- Bottom Track & Node -->
    <line x1="8" y1="22" x2="26" y2="22" stroke="#00B2FF" stroke-width="2.2" stroke-linecap="round" stroke-opacity="0.6" />
    <circle cx="14" cy="22" r="3.2" fill="#00E599" />
    <circle cx="14" cy="22" r="1.4" fill="#FFFFFF" />

    <!-- Right Task Checklist Column with dynamic checkmark -->
    <rect x="29" y="8" width="6" height="18" rx="3" fill="#00B2FF" fill-opacity="0.22" />
    <path 
      d="M26 18.5L28.8 21.2L34.5 14.5" 
      stroke="#FFFFFF" 
      stroke-width="2.2" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
    />
  </g>

  <defs>
    <linearGradient id="taGradient" x1="2" y1="2" x2="42" y2="34" gradientUnits="userSpaceOnUse">
      <stop stop-color="#082552" />
      <stop offset="1" stop-color="#02142E" />
    </linearGradient>
  </defs>
</svg>
